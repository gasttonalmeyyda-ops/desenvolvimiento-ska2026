<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Mago vs Espadachim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Mago vs Espadachim</h1>

      <p>Vida: <span id="vida-mago"></span></p>
      <button id="atacar-mago">Atacar!</button>

    <div class="personagem" id="espadachim">

      <p>Vida: <span id="vida-espadachim"></span></p>
      <button id="atacar-espadachim">Atacar!</button>
    </div>
  </div>
  <div id="mensagem"></div>

  <script src="dist/bundle.js"></script>
</body>
</html>
